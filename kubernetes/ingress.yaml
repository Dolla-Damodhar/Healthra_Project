apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthra-ingress
  namespace: healthra
  annotations:
    # cert-manager watches this and requests/renews a Let's Encrypt cert via
    # the HTTP-01 solver configured on the letsencrypt-prod ClusterIssuer.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - healthraa.duckdns.org
    secretName: healthra-tls
  rules:
  - host: healthraa.duckdns.org
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: healthra-backend
            port:
              number: 8000
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: healthra-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: healthra-frontend
            port:
              number: 80
