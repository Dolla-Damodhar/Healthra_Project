# NOT applied by the Jenkins pipeline. The pipeline's Deploy stage generates
# the real "healthra-secrets" object at deploy time from Jenkins credentials
# (IDs: django-secret-key, db-password) via `kubectl create secret ... |
# kubectl apply -f -`, so production values never live in git.
#
# This file is kept only as a schema reference for local/manual testing.
# The placeholder values below are intentionally insecure — do not
# `kubectl apply` this against any real cluster.
apiVersion: v1
kind: Secret
metadata:
  name: healthra-secrets
  namespace: healthra
type: Opaque
data:
  # Default value: django-insecure-prod-secret-key-change-me
  django-secret-key: ZGphbmdvLWluc2VjdXJlLXByb2Qtc2VjcmV0LWtleS1jaGFuZ2UtbWU=
  # Default value: postgres
  db-password: cG9zdGdyZXM=

