apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthra-frontend
  namespace: healthra
  labels:
    app: healthra-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthra-frontend
  template:
    metadata:
      labels:
        app: healthra-frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/"
    spec:
      containers:
      - name: frontend
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthra-frontend:${IMAGE_TAG}
        # Always, not IfNotPresent: IMAGE_TAG is a mutable, reused ECR tag
        # (e.g. after a hotfix rebuild without an app change), so nodes must
        # re-check the registry rather than trust a same-tag image cached
        # locally from a previous, possibly different, build.
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

