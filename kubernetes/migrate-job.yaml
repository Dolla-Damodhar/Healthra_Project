apiVersion: batch/v1
kind: Job
metadata:
  name: healthra-migrate
  namespace: healthra
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthra-backend:${IMAGE_TAG}
        imagePullPolicy: Always
        command: ["python", "manage.py", "migrate", "--noinput"]
        env:
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: django-secret-key
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: db-password
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-port
