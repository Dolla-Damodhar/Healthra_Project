apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthra-backend
  namespace: healthra
  labels:
    app: healthra-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthra-backend
  template:
    metadata:
      labels:
        app: healthra-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"  # Scrapes Prometheus metrics if integrated later
    spec:
      containers:
      - name: backend
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthra-backend:${IMAGE_TAG}
        # Always, not IfNotPresent: IMAGE_TAG is a mutable, reused ECR tag
        # (e.g. after a hotfix rebuild without an app change), so nodes must
        # re-check the registry rather than trust a same-tag image cached
        # locally from a previous, possibly different, build.
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: django-secret-key
        - name: ALLOWED_HOSTS
          value: "*"
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-name
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: db-password
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: healthra-config
              key: db-port
        - name: CORS_ALLOWED_ORIGINS
          value: "https://healthraa.duckdns.org"
        - name: CSRF_TRUSTED_ORIGINS
          value: "https://healthraa.duckdns.org"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

