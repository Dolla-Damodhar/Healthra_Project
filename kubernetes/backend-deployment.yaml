apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthra-backend
  namespace: healthra
  labels:
    app: healthra-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthra-backend
  template:
    metadata:
      labels:
        app: healthra-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"  # Scrapes Prometheus metrics if integrated later
    spec:
      containers:
      - name: backend
        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/healthra-backend:${IMAGE_TAG}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DEBUG
          value: "False"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: django-secret-key
        - name: ALLOWED_HOSTS
          value: "*"
        - name: DB_NAME
          value: "healthra"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: healthra-secrets
              key: db-password
        - name: DB_HOST
          value: "healthra-db.cjdxxcr.us-east-1.rds.amazonaws.com"  # Replace with actual RDS host or local DB service
        - name: DB_PORT
          value: "5432"
        - name: CORS_ALLOWED_ORIGINS
          value: "http://localhost,http://127.0.0.1" # Overwritten by deployment domain
        - name: CSRF_TRUSTED_ORIGINS
          value: "http://localhost,http://127.0.0.1"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /admin/login/
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

